<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixMate Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.12);
        }
        h1 { text-align: center; color: #1f4cff; margin-bottom: 8px; }
        p { text-align: center; color: #666; margin-bottom: 25px; }
        label { display: block; margin: 14px 0 7px; font-weight: 600; }
        input {
            width: 100%; padding: 12px; border: 1px solid #ccc;
            border-radius: 8px; font-size: 15px;
        }
        button {
            width: 100%; margin-top: 22px; padding: 13px;
            border: 0; border-radius: 8px; background: #1f4cff;
            color: white; font-size: 16px; cursor: pointer;
        }
        button:hover { background: #0d2fb3; }
        .flash { padding: 10px; border-radius: 8px; background: #ffe6e6; color: #b00020; margin-bottom: 12px; text-align: center; }
        .back { display: block; text-align: center; margin-top: 18px; color: #1f4cff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 FixMate Admin</h1>
        <p>Login to your FixMate admin account</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="/admin" method="POST">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="admin@fixmate.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter admin password" required>

            <button type="submit">Login as Admin</button>
        </form>

        <a class="back" href="/">← Back to FixMate Home</a>
    </div>
</body>
</html>

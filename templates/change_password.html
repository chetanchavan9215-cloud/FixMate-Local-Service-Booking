<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password - FixMate</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav>

    <h2>FixMate</h2>

    <ul>

        <li>
            <a href="/dashboard">Dashboard</a>
        </li>

        <li>
            <a href="/mybookings">My Bookings</a>
        </li>

        <li>
            <a href="/profile">Profile</a>
        </li>

        <li>
            <a href="/logout">Logout</a>
        </li>

    </ul>

</nav>


<div class="login-container">

    <div class="login-box">

        <h1>🔒 Change Password</h1>

        <p>Enter your current and new password.</p>

        <hr>


        <form method="POST">


            <input type="password"
                   name="current_password"
                   placeholder="Current Password"
                   required>


            <input type="password"
                   name="new_password"
                   placeholder="New Password"
                   required>


            <input type="password"
                   name="confirm_password"
                   placeholder="Confirm New Password"
                   required>


            <button type="submit">
                🔒 Change Password
            </button>


        </form>


        <br>


        <a href="/profile">

            <button type="button">
                ← Back to Profile
            </button>

        </a>


    </div>

</div>

</body>

</html>

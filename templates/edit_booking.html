<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Booking - FixMate</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        .map-section {
            width: 100%;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .map-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: #222;
        }

        #map {
            width: 100%;
            height: 350px;
            border-radius: 12px;
            border: 1px solid #ddd;
            overflow: hidden;
        }

        .location-button {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1f4cff;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .location-button:hover {
            background: #0d2fb3;
        }

        .location-info {
            margin-top: 8px;
            font-size: 13px;
            color: #555;
            text-align: center;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <form class="login-box"
              method="POST"
              id="editBookingForm">

            <h2>Edit Booking</h2>

            <input
                type="text"
                name="name"
                value="{{ booking['name'] }}"
                placeholder="Name"
                required
            >

            <input
                type="text"
                name="phone"
                value="{{ booking['phone'] }}"
                placeholder="Phone"
                required
            >

            <input
                type="text"
                name="address"
                value="{{ booking['address'] }}"
                placeholder="Address"
                required
            >

            <select name="service" required>

                <option value="Electrician"
                    {% if booking['service'] == 'Electrician' %}selected{% endif %}>
                    Electrician
                </option>

                <option value="Plumber"
                    {% if booking['service'] == 'Plumber' %}selected{% endif %}>
                    Plumber
                </option>

                <option value="Painter"
                    {% if booking['service'] == 'Painter' %}selected{% endif %}>
                    Painter
                </option>

                <option value="Carpenter"
                    {% if booking['service'] == 'Carpenter' %}selected{% endif %}>
                    Carpenter
                </option>

                <option value="AC Repair"
                    {% if booking['service'] == 'AC Repair' %}selected{% endif %}>
                    AC Repair
                </option>

                <option value="House Cleaning"
                    {% if booking['service'] == 'House Cleaning' %}selected{% endif %}>
                    House Cleaning
                </option>

                <option value="Appliance Repair"
                    {% if booking['service'] == 'Appliance Repair' %}selected{% endif %}>
                    Appliance Repair
                </option>

                <option value="Home Shifting"
                    {% if booking['service'] == 'Home Shifting' %}selected{% endif %}>
                    Home Shifting
                </option>

                <option value="Gardening"
                    {% if booking['service'] == 'Gardening' %}selected{% endif %}>
                    Gardening
                </option>

                <option value="Locksmith"
                    {% if booking['service'] == 'Locksmith' %}selected{% endif %}>
                    Locksmith
                </option>

            </select>

            <input
                type="date"
                name="date"
                value="{{ booking['date'] }}"
                required
            >

            <input
                type="time"
                name="time"
                value="{{ booking['time'] }}"
                required
            >

            <div class="map-section">

                <div class="map-title">
                    📍 Service Location
                </div>

                <div id="map"></div>

                <button
                    type="button"
                    class="location-button"
                    onclick="useCurrentLocation()"
                >
                    📍 Use My Current Location
                </button>

                <div
                    class="location-info"
                    id="locationInfo"
                >
                    Click on the map to change the service location.
                </div>

            </div>

            <input
                type="hidden"
                name="latitude"
                id="latitude"
                value="{{ booking['latitude'] if booking['latitude'] is not none else '' }}"
            >

            <input
                type="hidden"
                name="longitude"
                id="longitude"
                value="{{ booking['longitude'] if booking['longitude'] is not none else '' }}"
            >

            <button type="submit">
                Update Booking
            </button>

            <br>
            <br>

            <a href="/mybookings">
                ⬅ Back to My Bookings
            </a>

        </form>

    </div>

    <!-- Leaflet JS -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        const existingLatitude =
            parseFloat("{{ booking['latitude'] if booking['latitude'] is not none else '' }}");

        const existingLongitude =
            parseFloat("{{ booking['longitude'] if booking['longitude'] is not none else '' }}");

        let defaultLatitude = 20.5937;
        let defaultLongitude = 78.9629;
        let defaultZoom = 5;

        if (
            !isNaN(existingLatitude) &&
            !isNaN(existingLongitude)
        ) {
            defaultLatitude = existingLatitude;
            defaultLongitude = existingLongitude;
            defaultZoom = 16;
        }

        const map = L.map("map").setView(
            [
                defaultLatitude,
                defaultLongitude
            ],
            defaultZoom
        );

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

        let marker = null;

        function setLocation(latitude, longitude) {

            document.getElementById("latitude").value =
                latitude;

            document.getElementById("longitude").value =
                longitude;

            if (marker) {
                map.removeLayer(marker);
            }

            marker = L.marker(
                [
                    latitude,
                    longitude
                ]
            ).addTo(map);

            marker
                .bindPopup("📍 Selected Service Location")
                .openPopup();

            map.setView(
                [
                    latitude,
                    longitude
                ],
                16
            );

            document.getElementById("locationInfo").innerHTML =
                "Latitude: " +
                latitude.toFixed(6) +
                "<br>" +
                "Longitude: " +
                longitude.toFixed(6);
        }

        if (
            !isNaN(existingLatitude) &&
            !isNaN(existingLongitude)
        ) {

            setLocation(
                existingLatitude,
                existingLongitude
            );

        }

        map.on("click", function(event) {

            const latitude =
                event.latlng.lat;

            const longitude =
                event.latlng.lng;

            setLocation(
                latitude,
                longitude
            );

        });

        function useCurrentLocation() {

            if (!navigator.geolocation) {

                alert(
                    "Your browser does not support location."
                );

                return;
            }

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;

                    setLocation(
                        latitude,
                        longitude
                    );

                },

                function() {

                    alert(
                        "Unable to get your current location. Please allow location permission or select the location manually on the map."
                    );

                }

            );

        }

        document
            .getElementById("editBookingForm")
            .addEventListener(
                "submit",
                function(event) {

                    const latitude =
                        document.getElementById("latitude").value;

                    const longitude =
                        document.getElementById("longitude").value;

                    if (!latitude || !longitude) {

                        event.preventDefault();

                        alert(
                            "Please select your service location on the map."
                        );

                        return;
                    }

                    const lat =
                        parseFloat(latitude);

                    const lon =
                        parseFloat(longitude);

                    if (
                        isNaN(lat) ||
                        isNaN(lon) ||
                        lat < -90 ||
                        lat > 90 ||
                        lon < -180 ||
                        lon > 180
                    ) {

                        event.preventDefault();

                        alert(
                            "Please select a valid service location."
                        );

                    }

                }
            );

    </script>

</body>

</html>
